<div class="deposita-container">
  <div class="card">
    <div class="card-header">
      <h2>Deposita Denaro</h2>
      <p>Aggiungi fondi al tuo conto</p>
    </div>

    <div class="card-body">
      @if (success()) {
      <div class="alert success">
        Deposito effettuato con successo!
        <br>Reindirizzamento ai movimenti...
      </div>
      }

      @if (error()) {
      <div class="alert error">
        {{ error() }}
      </div>
      }

      <form (ngSubmit)="onSubmit()" #depositForm="ngForm">
        <div class="form-group">
          <label for="amount">Importo *</label>
          <input type="number" id="amount" name="amount" [(ngModel)]="amount" step="0.01" min="0.01"
            required [class.error-input]="amountError()">
          @if (amountError()) {
          <div class="field-error">{{ amountError() }}</div>
          }
        </div>

        <div class="form-group">
          <label for="description">Descrizione *</label>
          <input type="text" id="description" name="description" [(ngModel)]="description"
            required [class.error-input]="descriptionError()">
          @if (descriptionError()) {
          <div class="field-error">{{ descriptionError() }}</div>
          }
        </div>

        <div class="form-actions">
          <button type="button" class="btn-secondary" (click)="resetForm()">
            Cancella
          </button>
          <button type="submit" class="btn-primary">
            <span>Deposita</span>
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
