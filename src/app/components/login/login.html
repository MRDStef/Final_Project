<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <h2>🏦 Mini Banking API</h2>
      <p>Accedi al tuo conto</p>
    </div>
    
    <div class="login-body">
      @if (error()) {
        <div class="alert error">
          ⚠ {{ error() }}
        </div>
      }
      
      <form (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label for="ownerName">Nome Account</label>
          <input
            type="text"
            id="ownerName"
            [(ngModel)]="ownerName"
            name="ownerName"
            placeholder="es. Mario Rossi"
            required
          >
        </div>
        
        <div class="form-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            [(ngModel)]="password"
            name="password"
            placeholder="Inserisci password"
            required
          >
        </div>
        
        <button type="submit" class="btn-login" [disabled]="loading()">
          @if (loading()) {
            <span>⏳ Accesso in corso...</span>
          } @else {
            <span>🔐 Accedi</span>
          }
        </button>
      </form>
      
      <div class="demo-credentials">
        <p>Credenziali di test:</p>
        <ul>
          <li><strong>Mario Rossi</strong> / mario123</li>
          <li><strong>Luigi Verdi</strong> / luigi456</li>
          <li><strong>Anna Bianchi</strong> / anna789</li>
        </ul>
      </div>
    </div>
  </div>
</div>
